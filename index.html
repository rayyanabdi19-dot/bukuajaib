    <script>
      (function() {
        function isIgnoredLogMsg(arg) {
          if (!arg) return false;
          try {
            var str = typeof arg === 'string'
              ? arg
              : (arg.message || arg.stack || (typeof arg.toString === 'function' ? arg.toString() : ''));
            if (typeof str === 'string') {
              if (
                str.indexOf('[vite]') !== -1 ||
                str.indexOf('failed to connect to websocket') !== -1 ||
                str.indexOf('WebSocket') !== -1 ||
                str.indexOf('@firebase/firestore') !== -1 ||
                str.indexOf('Could not reach Cloud Firestore backend') !== -1
              ) {
                return true;
              }
            }
          } catch (_) {}
          return false;
        }

        var _origLog = console.log;
        console.log = function() {
          var args = Array.prototype.slice.call(arguments);
          try {
            if (args.some(isIgnoredLogMsg)) return;
          } catch (_) {}
          _origLog.apply(console, args);
        };

        var _origErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          try {
            if (args.some(isIgnoredLogMsg)) return;
          } catch (_) {}
          _origErr.apply(console, args);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          try {
            if (args.some(isIgnoredLogMsg)) return;
          } catch (_) {}
          _origWarn.apply(console, args);
        };

        var _origInfo = console.info;
        console.info = function() {
          var args = Array.prototype.slice.call(arguments);
          try {
            if (args.some(isIgnoredLogMsg)) return;
          } catch (_) {}
          _origInfo.apply(console, args);
        };

        var _origDebug = console.debug;
        console.debug = function() {
          var args = Array.prototype.slice.call(arguments);
          try {
            if (args.some(isIgnoredLogMsg)) return;
          } catch (_) {}
          _origDebug.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          try {
            if (
              e &&
              (isIgnoredLogMsg(e.message) ||
                isIgnoredLogMsg(e.error) ||
                (e.filename && e.filename.indexOf('vite') !== -1))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          } catch (_) {}
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          try {
            if (
              e &&
              (isIgnoredLogMsg(e.reason) ||
                (e.reason && (isIgnoredLogMsg(e.reason.message) || isIgnoredLogMsg(e.reason.stack))))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          } catch (_) {}
        }, true);
      })();
    </script>
