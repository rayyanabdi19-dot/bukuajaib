<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6f4627"/>
      <stop offset="100%" stop-color="#4e311b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#d5c3b8" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Icon Group with shadow -->
  <g filter="url(#softGlow)" transform="translate(0, 4)">
    <!-- Open Book Base (Wedding Register) -->
    <!-- Left Page -->
    <path d="M100 360 C100 360, 160 370, 240 350 L240 180 C160 200, 100 190, 100 190 Z" fill="#faf6f2" stroke="#d5c3b8" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Page -->
    <path d="M412 360 C412 360, 352 370, 272 350 L272 180 C352 200, 412 190, 412 190 Z" fill="#ffffff" stroke="#d5c3b8" stroke-width="4" stroke-linejoin="round"/>
    <!-- Book Spine & Pages Thickness -->
    <path d="M100 360 C100 375, 160 385, 240 365 L240 350 C160 370, 100 360, 100 360 Z" fill="#e6dbd3"/>
    <path d="M412 360 C412 375, 352 385, 272 365 L272 350 C352 370, 412 360, 412 360 Z" fill="#d9ccc4"/>
    <path d="M240 180 L256 195 L272 180 L272 350 L256 365 L240 350 Z" fill="#8c6239"/>

    <!-- Bookmark ribbon -->
    <path d="M250 175 L250 380 L256 372 L262 380 L262 175 Z" fill="#c44536"/>

    <!-- Left Page Lines (Registry guest lines) -->
    <line x1="130" y1="230" x2="215" y2="230" stroke="#8c7355" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="130" y1="260" x2="215" y2="260" stroke="#8c7355" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="130" y1="290" x2="195" y2="290" stroke="#8c7355" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="130" y1="320" x2="210" y2="320" stroke="#8c7355" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Right Page: Envelope with Heart seal & Gold Quill -->
    <g transform="translate(290, 220)">
      <!-- Envelope Body -->
      <rect x="0" y="20" width="100" height="66" rx="6" fill="#fdfbf7" stroke="#8c6239" stroke-width="3"/>
      <!-- Flap -->
      <path d="M0 20 L50 62 L100 20 Z" fill="#f4ede4" stroke="#8c6239" stroke-width="3"/>
      <!-- Golden Seal -->
      <circle cx="50" cy="62" r="14" fill="url(#goldGrad)"/>
      <path d="M46 59 C46 56, 50 56, 50 58 C50 56, 54 56, 54 59 C54 62, 50 65, 50 66 C50 65, 46 62, 46 59 Z" fill="#6f4627"/>
    </g>

    <!-- Interlocking Golden Wedding Rings atop the book -->
    <g transform="translate(256, 135)">
      <circle cx="-16" cy="0" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="7"/>
      <circle cx="16" cy="0" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="7"/>
      <!-- Sparkle diamond -->
      <path d="M-16 -32 L-12 -28 L-16 -24 L-20 -28 Z" fill="#ffffff"/>
      <path d="M28 -12 L32 -8 L28 -4 L24 -8 Z" fill="#faecc8"/>
    </g>
  </g>
</svg>
